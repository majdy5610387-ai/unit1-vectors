function expl(){clearInterval(T);M.innerHTML=L.map((l,k)=>`<div class="card"><h2>${l[0]}</h2>${l[1].map(i=>`<details><summary>${i[0]}</summary><div>${RD(k>1?VEC(i[1]):i[1])}</div></details>`).join("")}</div>`).join("")}
function exam(){clearInterval(T);ans=[];done=false;M.innerHTML=`<div class="card"><h2>اختبار تجريبي</h2><p>${A(Q.length)} سؤالاً، الزمن ${A(30)} دقيقة. لا تظهر الإجابات إلا بعد التسليم.</p><button class="go" id="st">ابدأ الاختبار</button></div>`;st.onclick=run}
function run(){left=1800;M.innerHTML=`<div class="tm k" id="tm"></div>`+Q.map((q,i)=>`<div class="card"><div class="f">${A(i+1)}) ${RD(VEC(q[0]))}</div><div class="opts" id="o${i}">${q[1].map((o,j)=>`<button data-i="${i}" data-j="${j}">${["أ","ب","جـ","د"][j]}) ${RD(o)}</button>`).join("")}</div></div>`).join("")+`<button class="go" id="fin">تسليم</button>`;
M.onclick=e=>{const b=e.target.closest("button[data-j]");if(!b||done)return;ans[b.dataset.i]=+b.dataset.j;document.querySelectorAll("#o"+b.dataset.i+" button").forEach(x=>x.classList.toggle("s",x===b))};
fin.onclick=end;tick();T=setInterval(()=>{left--;tick();if(left<=0)end()},1000)}
function tick(){const t=document.getElementById("tm");if(t)t.innerHTML="الوقت المتبقي: <span dir=\"ltr\" style=\"unicode-bidi:isolate\">"+A(String(Math.floor(left/60)).padStart(2,"0"))+":"+A(String(left%60).padStart(2,"0"))+"</span>"}
function end(){if(done)return;done=true;clearInterval(T);let s=0;Q.forEach((q,i)=>{if(ans[i]===q[2])s++;document.querySelectorAll("#o"+i+" button").forEach((b,j)=>{b.classList.remove("s");if(j===q[2])b.classList.add("c");else if(j===ans[i])b.classList.add("w")});document.getElementById("o"+i).insertAdjacentHTML("afterend",`<div class="ex ${ans[i]===q[2]?"ok":"no"}">${ans[i]===q[2]?"صحيح":"الصحيح: "+["أ","ب","جـ","د"][q[2]]} — ${RD(VEC(q[3]))}</div>`)});
M.insertAdjacentHTML("afterbegin",`<div class="card rs"><h2>نتيجة الاختبار التجريبي</h2><div class="sc">${A(s)} / ${A(Q.length)}</div></div>`);window.scrollTo(0,0)}
function cd(){const el=document.getElementById("cd"),d=new Date(2026,10,19)-new Date();if(d<=0){el.textContent=d>-864e5?"الامتحان اليوم، بالتوفيق!":"انتهى موعد الامتحان";return}const s=Math.floor(d/1e3),p=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60],l=["أيام","ساعات","دقائق","ثوانٍ"];el.innerHTML="<div>يتبقى على امتحان الوحدة الأولى (الخميس ١٩/١١)</div><div class=\"ct\">"+p.map((v,i)=>`<div><b>${A(String(v).padStart(2,"0"))}</b><small>${l[i]}</small></div>`).join("")+"</div>"}
cd();setInterval(cd,1000);expl();
</script></body></html>
